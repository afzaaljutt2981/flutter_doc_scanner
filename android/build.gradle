group 'com.shirsh.flutter_doc_scanner'
version '1.0-SNAPSHOT'

buildscript {
    ///compatible with flutter 3.29
    ext.kotlin_version = "1.9.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        ///compatible with flutter 3.29
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.shirsh.flutter_doc_scanner'
    }

     buildFeatures {
        viewBinding = true
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
dependencies {

      // Standard Kotlin library
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation flutter.embedded.aar

    // Google ML Kit Document Scanner
    // Note: 16.0.0-beta1 is a beta. Check for a stable release if possible.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // AndroidX CameraX dependencies (UPDATED TO STABLE VERSION 1.3.1)
    // Always prefer stable versions over beta for production
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version" // Contains PreviewView
    implementation "androidx.camera:camera-video:$camerax_version"
    // If you need CameraX extensions (e.g., for HDR, auto-leveling etc.):
    // implementation "androidx.camera:camera-extensions:$camerax_version"

    // ConstraintLayout (from your activity_document_scanner.xml)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Latest stable as of this time

    // AndroidX AppCompat Library (Commonly needed for UI components and compatibility)
    implementation 'androidx.appcompat:appcompat:1.6.1' // Latest stable as of this time

    // Material Design Components (Often implicitly needed or helpful for UI elements)
    implementation 'com.google.android.material:material:1.12.0' // Latest stable as of this time

    // Lifecycle extensions for activities/fragments that observe lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    
    // implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    //  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version" // Ensure kotlin_version is defined
    // implementation flutter.embedded.aar

    // // AndroidX CameraX dependencies (adjust versions as needed)
    // def camerax_version = "1.1.0-beta01" // Or a stable version like 1.0.0, 1.2.x, 1.3.x
    // implementation "androidx.camera:camera-core:$camerax_version"
    // implementation "androidx.camera:camera-camera2:$camerax_version"
    // implementation "androidx.camera:camera-lifecycle:$camerax_version" // Important for lifecycle awareness
    // implementation "androidx.camera:camera-view:$camerax_version" // Contains PreviewView
    // implementation "androidx.camera:camera-video:$camerax_version"
    // // If you are using CameraX extensions (e.g., for auto-leveling, HDR)
    // // implementation "androidx.camera:camera-extensions:$camerax_version"

    // // ConstraintLayout (from your XML)
    // implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Use the latest stable version

    // // Other dependencies your plugin might need (e.g., ML Kit, OpenCV)
    // // ...
}